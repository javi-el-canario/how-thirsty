<!doctype html>
<html lang="en" data-theme="water">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How Thirsty?</title>
  <meta name="description" content="Endless mini-games about how much water or electricity AI prompts use.">
  <meta name="theme-color" content="#0b6aa8">
  <script>
    /* set theme + mode before first paint (no flash) */
    (function () {
      var d = document.documentElement, dark = false;
      try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      try {
        var s = JSON.parse(localStorage.getItem("ht.settings") || "{}");
        if (s.resource === "elec") d.dataset.theme = "elec";
        d.dataset.mode = s.mode === "light" || s.mode === "dark" ? s.mode : (dark ? "dark" : "light");
      } catch (e) { d.dataset.mode = dark ? "dark" : "light"; }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=31">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="bg-bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <header class="topbar">
    <button id="homeBtn" class="logo" type="button" aria-label="How Thirsty? Home">
      <span id="logoIcon" class="logo-icon" aria-hidden="true">💧</span>
      <span class="logo-text">How Thirsty?</span>
    </button>
    <div class="tools">
      <button id="resBtn" class="chip-btn" type="button">💧 Water</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙️</button>
      <button id="aboutBtn" class="icon-btn" type="button" aria-label="About these numbers">ℹ️</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="settingsDlg" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>
    <div id="settingsBody"></div>
  </dialog>

  <dialog id="aboutDlg" aria-labelledby="aboutTitle">
    <h2 id="aboutTitle">About these numbers</h2>
    <div id="aboutBody"></div>
  </dialog>

  <noscript><p class="panel">This game needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js?v=11"></script>
</body>
</html>
